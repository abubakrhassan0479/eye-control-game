
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3D Driving School</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;color:white;touch-action:none}
#game{position:fixed;inset:0}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;gap:8px}
.panel{background:#111d;border:1px solid #ffffff55;border-radius:12px;padding:10px;text-shadow:0 1px 3px #000}
#speed{font-size:30px;font-weight:bold;color:#6dff9a}
#mirror{position:fixed;top:75px;left:50%;transform:translateX(-50%);width:160px;height:45px;background:#182a32;border:4px solid #555;border-radius:12px;overflow:hidden}
#mirror canvas{width:100%;height:100%}
#controls{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 14px;gap:10px}
.group{display:flex;align-items:center;gap:8px}
button{color:white;background:#202a35dd;border:2px solid #ffffff88;border-radius:14px;font-weight:bold;padding:12px 10px;min-width:48px;min-height:48px;touch-action:none}
button:active,.selected{background:#078a56!important;border-color:#8dffbf!important}
#wheel{width:112px;height:112px;border:10px solid #303943;border-radius:50%;background:#141a20cc;position:relative;touch-action:none}
#wheel:before,#wheel:after{content:"";position:absolute;background:#9da8b1;border-radius:5px}
#wheel:before{width:9px;height:80px;left:41px;top:6px}
#wheel:after{height:9px;width:75px;left:9px;top:42px}
#center{position:absolute;inset:31px;border:5px solid #87939c;border-radius:50%;background:#202a35}
.pedal{width:65px;height:85px;background:linear-gradient(#68747d,#20252b);border-radius:14px;border:2px solid #bac4ca}
#gears{position:fixed;right:12px;bottom:120px;display:flex;gap:5px}
#gears button{min-width:39px;padding:8px 5px}
#start{position:fixed;inset:0;background:#08111deF;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:5}
#startBox{max-width:390px;width:100%;background:#182331;border:1px solid #ffffff44;border-radius:22px;padding:25px}
#start h1{margin:0 0 8px;color:#ff514f}
#start p{line-height:1.5;color:#dce6ee}
#enter{width:100%;background:#e52c32;font-size:19px;padding:16px;margin-top:10px}
#message{position:fixed;top:135px;left:50%;transform:translateX(-50%);background:#111c;padding:8px 14px;border-radius:10px;pointer-events:none}
@media(max-width:480px){
#wheel{width:90px;height:90px;border-width:8px}
#wheel:before{height:62px;left:33px;top:5px}
#wheel:after{width:58px;left:8px;top:33px}
#center{inset:25px}
#controls{padding:0 8px;gap:5px}
.group{gap:5px}
button{min-width:42px;padding:9px 7px}
.pedal{width:54px;height:74px}
#gears{bottom:105px}
#mirror{top:85px}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="panel">SPEED<br><span id="speed">0</span> km/h</div>
  <div class="panel">GEAR <span id="gearText">P</span><br>RPM <span id="rpm">800</span></div>
</div>

<div id="mirror"><canvas id="mirrorCanvas" width="320" height="90"></canvas></div>
<div id="message">Press ENTER DRIVE to start</div>

<div id="gears">
  <button data-gear="P" class="selected">P</button>
  <button data-gear="R">R</button>
  <button data-gear="N">N</button>
  <button data-gear="D">D</button>
</div>

<div id="controls">
  <div class="group">
    <div id="wheel"><div id="center"></div></div>
  </div>
  <div class="group">
    <button id="handbrake">HANDBRAKE</button>
    <button id="brake" class="pedal">BRAKE</button>
    <button id="accelerator" class="pedal">GAS</button>
  </div>
</div>

<div id="start">
 <div id="startBox">
  <h1>3D DRIVING SCHOOL</h1>
  <p>Drive your red sports sedan through the city. Use the steering wheel, gears, accelerator and brake to practise driving.</p>
  <p>Choose D to drive forward, R to reverse. Release the handbrake before moving.</p>
  <button id="enter">ENTER DRIVE</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const game = document.getElementById('game');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91c9ed);
scene.fog = new THREE.Fog(0x91c9ed, 70, 250);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 4.4, 9);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
game.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x647b55, 2));
const sun = new THREE.DirectionalLight(0xffffff, 2.3);
sun.position.set(-20, 35, 15);
sun.castShadow = true;
scene.add(sun);

const mat=(color,roughness=0.8)=>new THREE.MeshStandardMaterial({color,roughness});
const asphalt=mat(0x343a40), grass=mat(0x47864b), concrete=mat(0x777b80);
const white=mat(0xffffff), yellow=mat(0xffd34f);
const red=mat(0xc91426,0.28), dark=mat(0x111820,0.35), glass=mat(0x82bdcf,0.25);
const road=new THREE.Mesh(new THREE.PlaneGeometry(15,360),asphalt);
road.rotation.x=-Math.PI/2;road.position.set(0,-0.04,-110);scene.add(road);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),grass);
ground.rotation.x=-Math.PI/2;ground.position.set(0,-0.12,-100);scene.add(ground);

for(let x of [-7.7,7.7]){
 const curb=new THREE.Mesh(new THREE.BoxGeometry(.35,.18,360),white);
 curb.position.set(x,.04,-110);scene.add(curb);
}
const laneMarks=[];
for(let z=45;z>-290;z-=9){
 for(let x of [-2.5,2.5]){
  const m=new THREE.Mesh(new THREE.BoxGeometry(.13,.025,4),white);
  m.position.set(x,.01,z);scene.add(m);laneMarks.push(m);
 }
}
const buildings=[];
for(let side of [-1,1]){
 for(let i=0;i<34;i++){
  const h=5+Math.random()*17,w=4+Math.random()*5,d=5+Math.random()*7;
  const b=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat([0xb8b2a6,0x9baab4,0xc9b8a0,0x8e9da8][i%4]));
  body.position.y=h/2;body.castShadow=true;b.add(body);
  for(let yy=1.5;yy<h-1;yy+=2.2){
   for(let xx=-w/2+0.8;xx<w/2-0.3;xx+=1.25){
    const win=new THREE.Mesh(new THREE.BoxGeometry(.65,.9,.04),glass);
    win.position.set(xx,yy,d/2+.025);b.add(win);
    const win2=win.clone();win2.position.z=-d/2-.025;b.add(win2);
   }
  }
  b.position.set(side*(11+Math.random()*6),0,-i*10-10);scene.add(b);buildings.push({b,side,w,d,h});
 }
}

function makeCar(color=0xc91426){
 const g=new THREE.Group();
 const paint=mat(color,.25), black=mat(0x171b20,.55);
 const chassis=new THREE.Mesh(new THREE.BoxGeometry(1.9,.55,4.1),paint);
 chassis.position.y=.75;chassis.castShadow=true;g.add(chassis);
 const hood=new THREE.Mesh(new THREE.BoxGeometry(1.75,.2,1.1),paint);
 hood.position.set(0,1.02,-1.35);g.add(hood);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.5,.65,1.85),glass);
 cabin.position.set(0,1.28,.15);g.add(cabin);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(1.35,.12,1.05),paint);
 roof.position.set(0,1.64,.18);g.add(roof);
 const bumper=new THREE.Mesh(new THREE.BoxGeometry(1.8,.22,.18),black);
 bumper.position.set(0,.55,-2.1);g.add(bumper);
 for(let x of [-.98,.98]){
  for(let z of [-1.35,1.35]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.24,20),black);
   wheel.rotation.z=Math.PI/2;wheel.position.set(x,.43,z);wheel.castShadow=true;g.add(wheel);
   const hub=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.25,16),mat(0xa9b0b7,.35));
   hub.rotation.z=Math.PI/2;hub.position.set(x*1.01,.43,z);g.add(hub);
  }
  const head=new THREE.Mesh(new THREE.BoxGeometry(.45,.18,.07),mat(0xfff3c4,.3));
  head.position.set(x*.78,.85,-2.08);g.add(head);
  const tail=new THREE.Mesh(new THREE.BoxGeometry(.42,.17,.07),mat(0xff2525,.3));
  tail.position.set(x*.78,.83,2.08);g.add(tail);
 }
 return g;
}
const car=makeCar();car.position.set(0,0,3);scene.add(car);

const traffic=[];
for(let i=0;i<9;i++){
 const colors=[0xeeeeee,0x1767b1,0x252a31,0xd8a22a,0xeeeeee];
 const t=makeCar(colors[i%colors.length]);
 t.scale.setScalar(.94);
 t.position.set([-4.8,-1.7,1.7,4.8][i%4],0,-22-i*27);
 scene.add(t);traffic.push(t);
}

let started=false,gear='P',speed=0,rpm=800,steer=0;
let throttle=false,braking=false,handbrake=true,crashed=false;
let wheelAngle=0,hitTimer=0;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

$('enter').addEventListener('click',()=>{
 started=true;gear='D';handbrake=false;crashed=false;
 $('start').style.display='none';$('message').textContent='Drive safely!';
 updateGears();
});
function updateGears(){
 $('gearText').textContent=gear;
 document.querySelectorAll('[data-gear]').forEach(b=>b.classList.toggle('selected',b.dataset.gear===gear));
}
document.querySelectorAll('[data-gear]').forEach(b=>b.addEventListener('click',()=>{
 gear=b.dataset.gear;updateGears();
 if(gear==='P'||gear==='N') speed*=.97;
}));

function holdButton(id,callbackOn,callbackOff){
 const el=$(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);callbackOn();});
 const off=e=>{callbackOff();};
 el.addEventListener('pointerup',off);
 el.addEventListener('pointercancel',off);
 el.addEventListener('lostpointercapture',off);
}
holdButton('accelerator',()=>throttle=true,()=>throttle=false);
holdButton('brake',()=>braking=true,()=>braking=false);
$('handbrake').addEventListener('click',()=>{
 handbrake=!handbrake;$('handbrake').classList.toggle('selected',handbrake);
});

let wheelDragging=false,lastX=0;
$('wheel').addEventListener('pointerdown',e=>{
 wheelDragging=true;lastX=e.clientX;$('wheel').setPointerCapture(e.pointerId);
});
$('wheel').addEventListener('pointermove',e=>{
 if(!wheelDragging)return;
 const dx=e.clientX-lastX;lastX=e.clientX;
 wheelAngle=clamp(wheelAngle+dx*.012,-0.65,0.65);
 $('wheel').style.transform=`rotate(${wheelAngle*100}deg)`;
 steer=wheelAngle/.65;
});
function stopWheel(){wheelDragging=false;}
$('wheel').addEventListener('pointerup',stopWheel);
$('wheel').addEventListener('pointercancel',stopWheel);

addEventListener('keydown',e=>{
 if(e.key==='ArrowUp'||e.key==='w')throttle=true;
 if(e.key==='ArrowDown'||e.key==='s')braking=true;
 if(e.key==='ArrowLeft'||e.key==='a')steer=-1;
 if(e.key==='ArrowRight'||e.key==='d')steer=1;
 if(e.key===' ')handbrake=!handbrake;
 if(['1','2','3','4'].includes(e.key)){
  gear=({'1':'P','2':'R','3':'N','4':'D'})[e.key];updateGears();
 }
});
addEventListener('keyup',e=>{
 if(e.key==='ArrowUp'||e.key==='w')throttle=false;
 if(e.key==='ArrowDown'||e.key==='s')braking=false;
 if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))steer=0;
});

const mirror=$('mirrorCanvas'),mctx=mirror.getContext('2d');
function drawMirror(){
 mctx.fillStyle='#182b32';mctx.fillRect(0,0,320,90);
 mctx.fillStyle='#515e62';mctx.fillRect(0,42,320,48);
 mctx.fillStyle='#ddd';mctx.fillRect(151,42,4,18);
 for(let i=0;i<traffic.length;i++){
  const t=traffic[i],dist=t.position.z-car.position.z;
  if(dist>0&&dist<75){
   const x=160+(t.position.x-car.position.x)*16;
   const y=80-dist*.65;
   mctx.fillStyle='#c51c2c';mctx.fillRect(x-9,y-7,18,11);
  }
 }
}

function resetTraffic(t){
 t.position.z=-220-Math.random()*100;
 t.position.x=[-4.8,-1.7,1.7,4.8][Math.floor(Math.random()*4)];
}
function crash(){
 if(hitTimer>0)return;
 hitTimer=1.5;speed*=.35;
 $('message').textContent='Impact! Slow down and steer safely.';
}
let last=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 if(started){
  if(hitTimer>0)hitTimer-=dt;
  if(!handbrake){
   if(throttle&&(gear==='D'||gear==='R')){
    speed+= (gear==='D'?34:-18)*dt;
   }
   if(braking)speed-=55*dt;
  } else speed-=30*dt;
  if(gear==='P'||gear==='N')speed-=20*dt;
  speed=clamp(speed,-35,300);
  if(Math.abs(speed)<.5)speed=0;
  const move=speed*dt*.12;
  car.position.z-=move;
  car.rotation.y=-steer*.23;
  car.position.x+=steer*dt*(speed>=0?1:-1)*Math.min(5,Math.abs(speed)*.11);
  car.position.x=clamp(car.position.x,-5.3,5.3);
  for(const mark of laneMarks){
   mark.position.z+=move;
   if(mark.position.z>12)mark.position.z-=330;
  }
  for(const item of buildings){
   item.b.position.z+=move;
   if(item.b.position.z>30)item.b.position.z-=340;
  }
  for(const t of traffic){
   t.position.z+=move;
   if(t.position.z>12)resetTraffic(t);
   if(Math.abs(t.position.z-car.position.z)<2.7&&Math.abs(t.position.x-car.position.x)<1.8)crash();
  }
  if(Math.abs(car.position.x)>4.9) speed*=Math.pow(.96,dt*60);
  rpm=800+Math.abs(speed)*32+(throttle?900:0);
  $('speed').textContent=Math.round(Math.abs(speed));
  $('rpm').textContent=Math.round(clamp(rpm,800,8500));
  if(hitTimer<=0)$('message').textContent=handbrake?'Handbrake ON':(gear==='P'?'Parked':'Drive carefully');
 }
 camera.position.x+=(car.position.x*.48-camera.position.x)*Math.min(1,dt*3);
 camera.position.z=car.position.z+8;
 camera.position.y=4.3+Math.abs(speed)*.0015;
 camera.lookAt(car.position.x*.65,1,car.position.z-10);
 drawMirror();
 renderer.render(scene,camera);
}
requestAnimationFrame(animate);
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
