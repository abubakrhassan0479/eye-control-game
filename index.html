
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Red Civic Driving Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;color:white;font-family:Arial,sans-serif;touch-action:none}
#scene{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;padding:9px;align-items:flex-start}
.panel{background:#111b26e8;border:1px solid #697887;border-radius:12px;padding:8px 11px;text-align:center}
.small{font-size:10px;color:#c3d0dc}
#speed{font-size:25px;color:#fff;font-weight:bold}
#rpm{font-size:14px;color:#ffb34e}
#mirror{width:145px;height:48px;background:#222;border:4px solid #555;border-radius:8px;display:block}
#mirrorWrap{position:absolute;top:9px;left:50%;transform:translateX(-50%);text-align:center}
#mirrorLabel{font-size:9px;color:#fff;background:#222b;padding:2px}
#dashboard{position:absolute;bottom:0;width:100%;height:34%;min-height:180px;background:linear-gradient(#222d,#090d14 24%,#171c25 80%);border-top:3px solid #525a64;border-radius:24px 24px 0 0;pointer-events:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.dashrow{display:flex;align-items:center;justify-content:space-around;gap:8px;height:100%}
#steer{width:112px;height:112px;max-width:28vw;max-height:28vw;border:10px solid #161719;border-radius:50%;background:radial-gradient(circle,#292d33 0 22%,#08090b 24% 31%,transparent 33%),conic-gradient(#292c31,#555,#17191c,#555,#292c31);box-shadow:0 0 0 2px #666;position:relative;touch-action:none;flex-shrink:0}
#steer:before,#steer:after{content:"";position:absolute;background:#222;border:2px solid #666;border-radius:4px}
#steer:before{width:72%;height:11px;left:14%;top:46%}
#steer:after{width:10px;height:45%;left:45%;top:50%}
#horn{position:absolute;left:34%;top:33%;width:32%;height:32%;border-radius:50%;background:#151719;border:2px solid #555;z-index:2}
.pedalarea{display:flex;gap:6px;align-items:end}
.pedal{width:49px;height:75px;border-radius:9px;border:2px solid #6c727a;background:repeating-linear-gradient(0deg,#272c32 0 6px,#424750 7px 9px);color:white;font-size:10px;font-weight:bold;touch-action:none}
.pedal:active{background:#686d74}
#brake{height:65px}
#handbrake{width:42px;height:52px;background:#30343a;border:2px solid #727880;border-radius:8px;color:white;font-size:10px}
#gear{width:54px;height:100px;background:linear-gradient(90deg,#191c21,#343a43,#171a20);border:2px solid #555;border-radius:13px;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:4px}
.gear{background:#20252c;color:#ddd;border:1px solid #4d535a;border-radius:5px;width:36px;height:19px;font-weight:bold;font-size:11px;padding:0}
.gear.active{background:#e8e8e8;color:#111;border-color:white}
#ignition{border-radius:50%;width:43px;height:43px;background:radial-gradient(circle,#545b65,#111);border:3px solid #666;color:#fff;font-size:9px;font-weight:bold}
#ignition.on{color:#72ffc2;border-color:#72ffc2}
#startOverlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#09111acc;z-index:5}
#startCard{width:min(88%,330px);padding:22px;background:#151e2b;border:1px solid #bd252d;border-radius:20px;text-align:center}
h2{color:#ff4b52;margin:5px}
select, .mainbtn{width:100%;padding:12px;margin-top:9px;border-radius:10px;border:1px solid #697887;background:#222d3b;color:white;font-size:15px}
.mainbtn{background:#c91f2a;border:0;font-weight:bold}
#message{font-size:12px;color:#ffd27b;min-height:18px}
#gearLabel{font-size:11px;color:#9fe6ff}
@media(max-height:650px){
 #dashboard{height:31%;min-height:145px}
 #steer{width:90px;height:90px}
 .pedal{height:61px;width:42px}
 #brake{height:54px}
 #gear{height:83px}
 #mirror{height:38px}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud">
 <div class="top">
  <div class="panel">
   <div class="small">SPEED km/h</div>
   <div id="speed">0</div>
   <div id="rpm">0 RPM</div>
  </div>
  <div class="panel">
   <div class="small">TRIP DISTANCE</div>
   <b id="distance">0.0 km</b>
   <div class="small">MAX 300 km/h</div>
  </div>
 </div>

 <div id="mirrorWrap">
  <canvas id="mirror" width="290" height="96"></canvas>
  <div id="mirrorLabel">REAR VIEW MIRROR</div>
 </div>

 <div id="dashboard">
  <div class="dashrow">
   <div style="text-align:center">
    <div id="steer"><div id="horn"></div></div>
    <div class="small">STEERING</div>
   </div>

   <div style="text-align:center">
    <div id="gear">
     <button class="gear active" data-g="P">P</button>
     <button class="gear" data-g="R">R</button>
     <button class="gear" data-g="N">N</button>
     <button class="gear" data-g="D">D</button>
    </div>
    <div id="gearLabel">PARK</div>
   </div>

   <div class="pedalarea">
    <div style="text-align:center">
     <button class="pedal" id="brake">BRAKE</button>
     <div class="small">BRAKE</div>
    </div>
    <div style="text-align:center">
     <button class="pedal" id="accelerator">▲</button>
     <div class="small">ACCELERATOR</div>
    </div>
   </div>

   <div style="display:flex;flex-direction:column;align-items:center;gap:9px">
    <button id="ignition">START</button>
    <button id="handbrake">PARK<br>BRAKE</button>
    <div class="small">IGNITION</div>
   </div>
  </div>
 </div>
</div>

<div id="startOverlay">
 <div id="startCard">
  <h2>RED CIVIC DRIVE</h2>
  <p>3D Street Driving Simulator</p>
  <label for="carColor" class="small">CAR COLOUR</label>
  <select id="carColor">
   <option value="red">Civic Red</option>
   <option value="black">Gloss Black</option>
   <option value="white">Pearl White</option>
   <option value="blue">Sport Blue</option>
  </select>
  <p id="message">Select your car and start the engine.</p>
  <button class="mainbtn" id="enter">ENTER DRIVE</button>
  <div class="small" style="margin-top:10px">Use the steering wheel and pedals below.</div>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {RoundedBoxGeometry} from
'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/geometries/RoundedBoxGeometry.js';

const canvas=document.querySelector('#scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c9ed);
scene.fog=new THREE.Fog(0x91c9ed,75,240);

const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,350);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

scene.add(new THREE.HemisphereLight(0xeaf5ff,0x3b553a,2.1));
const sun=new THREE.DirectionalLight(0xffffff,2.6);
sun.position.set(-20,35,15);
sun.castShadow=true;
scene.add(sun);

const material=(color,metalness=0,roughness=.55)=>
 new THREE.MeshStandardMaterial({color,metalness,roughness});

const roadMat=material(0x34373d,0,.95);
const grassMat=material(0x3b8242);
const lineMat=material(0xf4f1dc);
const chrome=material(0x858b91,.8,.24);
const glass=material(0x193747,.35,.22);
const rubber=material(0x15171b);
const buildingMats=[0xb9a993,0x8798a9,0x9aada6,0x747a91,0xc4c8cb].map(c=>material(c));

function box(parent,w,h,d,x,y,z,mat,round=false){
 const geo=round
  ?new RoundedBoxGeometry(w,h,d,3,Math.min(.22,h*.35))
  :new THREE.BoxGeometry(w,h,d);
 const o=new THREE.Mesh(geo,mat);
 o.position.set(x,y,z);
 o.castShadow=true;o.receiveShadow=true;
 parent.add(o);return o;
}

// Long road and roadside
box(scene,200,.3,400,0,-.25,-150,grassMat);
box(scene,13,.12,400,0,-.04,-150,roadMat);
box(scene,.13,.025,400,-6.3,.035,-150,lineMat);
box(scene,.13,.025,400,6.3,.035,-150,lineMat);

const roadMarks=[];
for(let z=30;z>-400;z-=12){
 roadMarks.push(box(scene,.11,.025,5,0,.04,z,lineMat));
}
const buildings=[];
for(let z=25;z>-360;z-=18){
 for(const side of [-1,1]){
  const w=4+Math.random()*4,h=7+Math.random()*19;
  const x=side*(10+w/2);
  const b=box(scene,w,h,7,x,h/2-0.1,z,
   buildingMats[Math.floor(Math.random()*buildingMats.length)],true);
  buildings.push({b,z});
  // windows
  const win=material(0x9ed7e9,.1,.28);
  for(let yy=2;yy<h-1;yy+=3){
   for(let xx=-w/2+.8;xx<w/2-.4;xx+=1.5){
    box(scene,.7,.9,.035,x+xx,yy,z+3.52,win);
   }
  }
 }
}

// Model is stylised and inspired by a modern sedan, not an official Honda asset.
let bodyColor=0xc81927;
let player=new THREE.Group();
const wheelMeshes=[];
function createCivic(color){
 const car=new THREE.Group();
 const paint=material(color,.48,.24);

 // Smooth, rounded sedan body
 box(car,1.85,.53,4.35,0,.68,0,paint,true);
 box(car,1.64,.22,1.2,0,.96,1.47,paint,true);
 box(car,1.6,.22,1.25,0,.95,-1.47,paint,true);

 // Roof and cabin
 box(car,1.38,.64,1.95,0,1.30,-.08,paint,true);
 box(car,1.29,.49,1.79,0,1.34,-.08,glass,true);
 box(car,1.39,.09,.12,0,1.69,-.08,paint,true);

 // Front and rear glass panels
 box(car,1.3,.42,.06,0,1.34,.84,glass,true);
 box(car,1.3,.38,.06,0,1.32,-1.0,glass,true);

 // Grille, bumpers, headlights
 box(car,.84,.2,.08,0,.49,2.19,chrome,true);
 box(car,.48,.12,.09,0,.49,2.25,rubber,true);
 for(const x of [-.66,.66]){
  box(car,.38,.14,.1,x,.79,2.19,material(0xfff3cb,.15,.18),true);
  box(car,.35,.13,.1,x,.73,-2.19,material(0xff2434),true);
  // Mirrors
  box(car,.23,.13,.25,x*1.45,1.16,.53,paint,true);
  box(car,.07,.06,.18,x*1.52,1.17,.53,chrome,true);
  // Door handles
  box(car,.08,.045,.26,x*1.01,.82,.15,chrome,true);
  box(car,.08,.045,.26,x*1.01,.82,-.58,chrome,true);
 }

 // Four detailed wheels
 for(const x of [-.96,.96]){
  for(const z of [-1.43,1.42]){
   const wheel=new THREE.Group();
   wheel.position.set(x,.39,z);
   const tire=new THREE.Mesh(
    new THREE.CylinderGeometry(.36,.36,.19,24),rubber);
   tire.rotation.z=Math.PI/2;
   tire.castShadow=true;wheel.add(tire);
   const rim=new THREE.Mesh(
    new THREE.CylinderGeometry(.22,.22,.205,16),chrome);
   rim.rotation.z=Math.PI/2;wheel.add(rim);
   car.add(wheel);wheelMeshes.push(wheel);
  }
 }
 // Rear-view mirror body
 box(car,.31,.09,.08,0,1.61,.72,rubber,true);
 // Front windshield wiper detail
 box(car,.85,.025,.045,0,1.12,1.0,rubber,true);
 return car;
}
player=createCivic(bodyColor);
player.position.set(0,0,2);
scene.add(player);

// Traffic cars
const traffic=[];
function createTraffic(color){
 const g=new THREE.Group(),paint=material(color,.35,.32);
 box(g,1.65,.55,3.5,0,.63,0,paint,true);
 box(g,1.3,.55,1.6,0,1.02,-.12,glass,true);
 for(const x of [-.84,.84]){
  for(const z of [-1.12,1.12]){
   const w=new THREE.Mesh(new THREE.CylinderGeometry(.29,.29,.17,16),rubber);
   w.rotation.z=Math.PI/2;w.position.set(x,.33,z);g.add(w);
  }
  box(g,.3,.13,.06,x*.75,.67,1.77,material(0xff3333),true);
  box(g,.3,.13,.06,x*.75,.67,-1.77,material(0xfff2bf),true);
 }
 return g;
}
function spawnTraffic(){
 const lanes=[-4,0,4];
 const lane=lanes[Math.floor(Math.random()*lanes.length)];
 const colors=[0xd8dce3,0x20232a,0x2875b9,0xe3b72f,0xeeeeee];
 const car=createTraffic(colors[Math.floor(Math.random()*colors.length)]);
 car.position.set(lane,0,-130);
 scene.add(car);
 traffic.push({car,z:-130,lane});
}

// Side mirrors use small rendered views from rear-facing cameras.
const mirrorCanvas=document.querySelector('#mirror');
const mirrorRenderer=new THREE.WebGLRenderer({canvas:mirrorCanvas,antialias:false});
mirrorRenderer.setPixelRatio(1);
mirrorRenderer.setSize(290,96,false);
const rearCamera=new THREE.PerspectiveCamera(75,290/96,.1,200);
rearCamera.position.set(0,2.5,5);
rearCamera.lookAt(0,1,25);

const sideCanvases=[];
for(const side of [-1,1]){
 const c=document.createElement('canvas');
 c.width=120;c.height=54;
 c.style.cssText='position:fixed;top:76px;'+(side<0?'left:7px':'right:7px')+
 'width:62px;height:30px;border:2px solid #60656b;border-radius:5px;background:#222';
 document.body.appendChild(c);
 const r=new THREE.WebGLRenderer({canvas:c,antialias:false});
 r.setSize(120,54,false);
 const cam=new THREE.PerspectiveCamera(78,120/54,.1,120);
 sideCanvases.push({r,cam,side});
}

let carX=0,speed=0,distance=0,rpm=0,gear='P';
let ignition=false,driving=false,gas=false,braking=false;
let handbrake=true,steer=0,roadOffset=0,spawnTimer=0;
let last=performance.now();

function setGear(g){
 gear=g;
 document.querySelectorAll('.gear').forEach(b=>
  b.classList.toggle('active',b.dataset.g===g));
 document.querySelector('#gearLabel').textContent=
  ({P:'PARK',R:'REVERSE',N:'NEUTRAL',D:'DRIVE'})[g];
}
document.querySelectorAll('.gear').forEach(b=>{
 b.onclick=()=>setGear(b.dataset.g);
});

document.querySelector('#ignition').onclick=()=>{
 ignition=!ignition;
 document.querySelector('#ignition').classList.toggle('on',ignition);
 document.querySelector('#ignition').textContent=ignition?'ON':'START';
 if(!ignition){speed=0;driving=false;gas=false;}
};
document.querySelector('#handbrake').onclick=()=>{
 handbrake=!handbrake;
 document.querySelector('#handbrake').style.borderColor=handbrake?'#ff5555':'#72ffc2';
};

document.querySelector('#carColor').onchange=e=>{
 const value=e.target.value;
 bodyColor=({red:0xc81927,black:0x15171c,white:0xe8e8e8,blue:0x1263cf})[value];
 scene.remove(player);
 wheelMeshes.length=0;
 player=createCivic(bodyColor);
 player.position.set(carX,0,2);
 scene.add(player);
};

document.querySelector('#enter').onclick=()=>{
 document.querySelector('#startOverlay').style.display='none';
 setGear('D');handbrake=false;
 ignition=true;
 document.querySelector('#ignition').classList.add('on');
 document.querySelector('#ignition').textContent='ON';
 driving=true;
};

function hold(id,fn){
 const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();el.setPointerCapture(e.pointerId);fn(true);
 });
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])
  el.addEventListener(ev,()=>fn(false));
}
hold('accelerator',v=>gas=v);
hold('brake',v=>braking=v);

// Steering wheel follows finger drag and springs back to centre.
const steering=document.querySelector('#steer');
let steerPointer=null,steerStart=0;
steering.addEventListener('pointerdown',e=>{
 steerPointer=e.pointerId;steerStart=e.clientX;
 steering.setPointerCapture(e.pointerId);
});
steering.addEventListener('pointermove',e=>{
 if(steerPointer!==e.pointerId)return;
 steer=THREE.MathUtils.clamp((e.clientX-steerStart)/45,-1,1);
 steering.style.transform=`rotate(${steer*95}deg)`;
});
function releaseSteering(){
 steerPointer=null;steer=0;steering.style.transform='rotate(0deg)';
}
steering.addEventListener('pointerup',releaseSteering);
steering.addEventListener('pointercancel',releaseSteering);
window.addEventListener('blur',()=>{gas=false;braking=false;releaseSteering()});

function update(dt){
 if(!driving||!ignition)return;

 if(gas&&!handbrake){
  if(gear==='D')speed=Math.min(300,speed+42*dt);
  if(gear==='R')speed=Math.max(-25,speed-14*dt);
 }else if(braking||handbrake||gear==='P'){
  speed=Math.abs(speed)<1?0:speed-Math.sign(speed)*65*dt;
 }else if(gear==='N'){
  speed*=Math.pow(.992,dt*60);
 }else{
  speed*=Math.pow(.997,dt*60);
 }

 if(handbrake&&Math.abs(speed)<1)speed=0;
 rpm=ignition?(speed===0?(gas?1200:750):Math.min(7500,850+Math.abs(speed)*22)):0;

 const movement=speed*.075*dt;
 distance+=Math.abs(speed)*dt/3600;
 roadOffset+=movement;

 carX+=steer*(.9+Math.abs(speed)*.015)*dt;
 carX=THREE.MathUtils.clamp(carX,-4.4,4.4);

 player.position.x+=(carX-player.position.x)*.18;
 player.rotation.y=-steer*.14;
 wheelMeshes.forEach(w=>w.rotation.x+=movement*2);

 roadMarks.forEach(m=>{m.position.z+=movement;if(m.position.z>35)m.position.z-=432});
 buildings.forEach(o=>{o.b.position.z+=movement;if(o.b.position.z>40)o.b.position.z-=396});

 spawnTimer+=dt;
 if(spawnTimer>Math.max(.65,2.4-Math.abs(speed)/180)){
  spawnTraffic();spawnTimer=0;
 }

 for(let i=traffic.length-1;i>=0;i--){
  const t=traffic[i];
  t.z+=movement;
  t.car.position.z=t.z;

  // Collision
  if(Math.abs(t.z-2)<2.8&&Math.abs(t.lane-carX)<1.65){
   speed=0;gas=false;
   document.querySelector('#message').textContent='Collision! Drive carefully.';
  }
  if(t.z>24){
   scene.remove(t.car);traffic.splice(i,1);
  }
 }

 document.querySelector('#speed').textContent=Math.round(Math.abs(speed));
 document.querySelector('#rpm').textContent=Math.round(rpm)+' RPM';
 document.querySelector('#distance').textContent=distance.toFixed(1)+' km';
}

function renderMirrors(){
 // Rear view from behind the car, looking backwards along the road.
 rearCamera.position.set(carX,2.4,7);
 rearCamera.lookAt(carX,1,45);
 mirrorRenderer.render(scene,rearCamera);

 sideCanvases.forEach(({r,cam,side})=>{
  cam.position.set(carX+side*1.1,1.7,3);
  cam.lookAt(carX+side*10,1,24);
  r.render(scene,cam);
 });
}

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);last=now;
 update(dt);

 camera.position.set(
  carX*.7,
  4.4+Math.abs(speed)*.002,
  10.5
 );
 camera.lookAt(carX*.4,1,-13);
 renderer.render(scene,camera);
 renderMirrors();
}
requestAnimationFrame(animate);

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
